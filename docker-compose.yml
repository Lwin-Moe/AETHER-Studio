services:
  ui:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - aether_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    volumes:
      - aether_data:/app/data
    depends_on:
      ui:
        condition: service_healthy

volumes:
  aether_data:
